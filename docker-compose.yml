services:
  raffosberrybot:
    container_name: raffosberrybot
    environment:
      - PYTHONUNBUFFERED=1

      - API_TOKEN=${API_TOKEN:-placeholder}

      - OWNER_ID=${OWNER_ID:-123456789}

      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-placeholder}

      - DISPLAY=${DISPLAY}  # Variabile per il forwarding X11
    restart: unless-stopped
    build: .
    pull_policy: build
    volumes:
      - ${MEDIA_DIRECTORY}:/app/Downloads
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.Xauthority:/root/.Xauthority:ro  # Passa i cookie di autenticazione X11
    devices:
      - /dev/snd:/dev/snd
      - /dev/dri:/dev/dri 
    network_mode: "host"
    ipc: "host" 
    stdin_open: true
    tty: true
